name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, v2-terminal]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test || true
      - run: flutter build apk --release --target-platform android-arm64 -v --dart-define=MARKET_DATA_API_KEY=${{ secrets.MARKET_DATA_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: oro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
