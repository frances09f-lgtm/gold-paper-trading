name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64 -v
      - uses: actions/upload-artifact@v4
        with:
          name: gold-paper-trading-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
