name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, v2-terminal]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/oro-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/oro-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} -v --dart-define=MARKET_DATA_API_KEY=${{ secrets.MARKET_DATA_API_KEY }} --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Oro.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: oro-release-apk
          path: "build/app/outputs/flutter-apk/Oro.apk"
